# Local Vendor Libraries
sherpa-onnx = { group = "com.epubpro.vendor", name = "sherpa-onnx", version.ref = "sherpaOnnx" }

# Testing
junit4 = { group = "junit", name = "junit", version.ref = "junit" }
json = { group = "org.json", name = "json", version.ref = "json" }
